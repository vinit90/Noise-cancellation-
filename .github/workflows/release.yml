name: Build and Release APK

on:
  push:
    tags:
      - '*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Environment and Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          else
            touch .env
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage Release Binary
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/PhaseLab-debug.apk

      - name: Upload APK Artifact to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: PhaseLab-debug-apk
          path: release_assets/PhaseLab-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          echo "Target Release / Tag: $TAG_NAME"
          
          # Check if release already exists on GitHub
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release exists. Uploading APK asset..."
            gh release upload "$TAG_NAME" release_assets/PhaseLab-debug.apk --clobber
          else
            echo "Creating new GitHub Release and attaching APK..."
            gh release create "$TAG_NAME" release_assets/PhaseLab-debug.apk \
              --title "Release $TAG_NAME" \
              --notes "### PhaseLab Acoustic DSP & ANC Experiment
          - Built with Jetpack Compose & low-latency AudioTrack/AudioRecord
          - Download **PhaseLab-debug.apk** below and install on Android."
          fi
